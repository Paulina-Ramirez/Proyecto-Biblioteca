<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sanciones | Cozy Biblioteca</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon-cozy-cerezo.png">
    <meta name="theme-color" content="#342D3D">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app-shell"></div>
    <div id="toast"></div>

    <!-- Plantilla de la vista de sanciones -->
    <template id="fines-page-template">
        <div class="hd">
            <div>
                <h1 data-role="page-title"></h1>
                <span class="mu">Multas por retraso y estado de pago.</span>
            </div>
        </div>
        <div class="card">
            <div style="overflow:auto">
                <table>
                    <thead>
                        <tr data-role="table-head">
                            <th>ID</th>
                            <th data-role="user-heading">Usuario</th>
                            <th>Préstamo</th>
                            <th>Días</th>
                            <th>Monto</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody data-role="fines-rows"></tbody>
                </table>
            </div>
        </div>
    </template>

    <template id="fine-row-template">
        <tr>
            <td data-field="id"></td>
            <td data-field="user"></td>
            <td data-field="loan"></td>
            <td data-field="days"></td>
            <td data-field="amount"></td>
            <td data-field="date"></td>
            <td><span data-field="status" class="pill"></span></td>
        </tr>
    </template>

    <template id="fine-empty-row-template">
        <tr><td class="empty" data-role="empty-message"></td></tr>
    </template>

    <script src="js/common.js"></script>
    <script src="js/sanciones.js"></script>
</body>
</html>

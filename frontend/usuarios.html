<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Usuarios | Cozy Biblioteca</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon-cozy-cerezo.png">
    <meta name="theme-color" content="#342D3D">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app-shell"></div>
    <div id="toast"></div>

    <template id="users-page-template">
        <div class="hd">
            <div>
                <h1>Usuarios</h1>
                <span class="mu">Cuentas y roles registrados.</span>
            </div>
        </div>
        <div class="card">
            <div style="overflow:auto">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="users-rows"></tbody>
                </table>
            </div>
        </div>
    </template>

    <template id="user-row-template">
        <tr>
            <td data-field="id"></td>
            <td data-field="name"></td>
            <td data-field="email"></td>
            <td data-field="role"></td>
            <td><span data-field="status" class="pill"></span></td>
        </tr>
    </template>

    <template id="users-empty-row-template">
        <tr><td colspan="5" class="empty">No hay usuarios registrados.</td></tr>
    </template>

    <script src="js/common.js"></script>
    <script src="js/usuarios.js"></script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cozy Biblioteca | Acceso</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-cozy-cerezo.png">
  <meta name="theme-color" content="#342D3D">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth">
    <aside>
      <div class="brand">Cozy Biblioteca<small>Un espacio para leer</small></div>
      <h1>Un mundo de historias, a tu alcance.</h1>
      <p>Consulta el catálogo, gestiona tus préstamos y revisa tus sanciones en un solo lugar.</p>
      <div class="auth-note">Pequeñas pausas, grandes historias.</div>
    </aside>

    <main>
      <div class="box">
        <div class="auth-eyebrow">BIENVENIDA A TU BIBLIOTECA</div>
        <h1 id="auth-title">Iniciar sesión</h1>
        <p class="mu" id="auth-description">Ingresa con tu correo registrado.</p>

        <div class="tabs" role="tablist" aria-label="Acceso a la biblioteca">
          <button type="button" class="on" id="login-tab" role="tab" aria-selected="true">Iniciar sesión</button>
          <button type="button" id="register-tab" role="tab" aria-selected="false">Crear cuenta</button>
        </div>

        <form id="auth-form">
          <div id="name-field" hidden>
            <label for="nombre">Nombre completo</label>
            <input id="nombre" name="nombre" maxlength="100" autocomplete="name" disabled>
          </div>

          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" required autocomplete="email">

          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" required autocomplete="current-password">

          <div id="confirm-field" hidden>
            <label for="confirm">Confirmar contraseña</label>
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" disabled>
          </div>

          <div id="role-field" hidden>
            <label for="rol">Rol</label>
            <select id="rol" name="rol" disabled>
              <option>Estudiante</option>
              <option>Docente</option>
              <option>Bibliotecario</option>
            </select>
          </div>

          <div class="err" id="error" role="alert" aria-live="polite"></div>
          <button class="btn full" id="submit-button" type="submit">Entrar <span aria-hidden="true">→</span></button>
        </form>
      </div>
    </main>
  </div>

  <div id="toast" aria-live="polite" aria-atomic="true"></div>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

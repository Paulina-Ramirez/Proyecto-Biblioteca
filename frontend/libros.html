<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de libros | Cozy Biblioteca</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-cozy-cerezo.png">
  <meta name="theme-color" content="#342D3D">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app-shell"></div>
  <div id="toast" aria-live="polite" aria-atomic="true"></div>

  <!-- Estructura fija del catálogo. -->
  <template id="books-page-template">
    <div class="hd">
      <div>
        <h1 id="books-heading">Catálogo bibliográfico</h1>
        <span class="mu">Busca títulos, autores, ISBN y disponibilidad.</span>
      </div>
      <button class="btn" id="add-book" type="button" hidden>+ Registrar libro</button>
    </div>

    <section class="card">
      <div class="filters">
        <input id="book-search" type="search" placeholder="Buscar por título, autor o ISBN" aria-label="Buscar libros">
        <select id="category-filter" aria-label="Filtrar por categoría">
          <option value="">Todas las categorías</option>
        </select>
        <select id="availability-filter" aria-label="Filtrar por disponibilidad">
          <option value="">Toda disponibilidad</option>
          <option value="available">Solo disponibles</option>
        </select>
      </div>

      <p class="mu">Resultados: <b id="books-count">0</b></p>
      <div class="table-scroll" style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>Libro</th><th>Autor</th><th>Categoría</th><th>Stock</th>
              <th>Disponibles</th><th>Estado</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="books-rows"></tbody>
        </table>
      </div>
    </section>
  </template>

  <template id="book-row-template">
    <tr>
      <td><b class="book-title"></b><br><small class="mu book-isbn"></small></td>
      <td class="book-author"></td>
      <td class="book-category"></td>
      <td class="book-stock-total"></td>
      <td class="book-stock-available"></td>
      <td><span class="pill book-status"></span></td>
      <td class="book-actions"></td>
    </tr>
  </template>

  <template id="book-modal-template">
    <div class="ov" id="book-modal">
      <div class="md" role="dialog" aria-modal="true" aria-labelledby="book-modal-title">
        <h2 id="book-modal-title">Registrar libro</h2>
        <form id="book-form">
          <label for="book-isbn">ISBN</label>
          <input id="book-isbn" name="isbn" required placeholder="978-0132350884">

          <label for="book-title">Título</label>
          <input id="book-title" name="titulo" required maxlength="200">

          <label for="book-author">Autor</label>
          <input id="book-author" name="autor" required maxlength="150">

          <label for="book-category">Género / categoría</label>
          <select id="book-category" name="categoria" required></select>

          <label for="book-stock">Stock total</label>
          <input id="book-stock" name="stock_total" type="number" min="0" step="1" required value="1">

          <div class="err" id="book-error" role="alert" aria-live="polite"></div>
          <div class="row">
            <button type="button" class="sm" id="cancel-book">Cancelar</button>
            <button type="submit" class="btn">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <template id="book-empty-row-template">
    <tr><td colspan="7" class="empty">No hay resultados.</td></tr>
  </template>

  <script src="js/common.js"></script>
  <script src="js/libros.js"></script>
</body>
</html>

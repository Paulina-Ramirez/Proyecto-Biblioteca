<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Préstamos | Cozy Biblioteca</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon-cozy-cerezo.png">
    <meta name="theme-color" content="#342D3D">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app-shell"></div>
    <div id="toast"></div>

    <!-- Estructura de la vista de préstamos -->
    <template id="loans-page-template">
        <section class="hd">
            <div>
                <h1 id="loans-title"></h1>
                <span class="mu">Consulta el estado y las fechas de devolución.</span>
            </div>
        </section>

        <section class="card">
            <div style="overflow:auto">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th id="loan-user-heading" hidden>Usuario</th>
                            <th>Libro</th>
                            <th>Préstamo</th>
                            <th>Vencimiento</th>
                            <th>Devolución</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="loans-rows"></tbody>
                </table>
            </div>
        </section>
    </template>

    <template id="loan-row-template">
        <tr>
            <td data-field="id"></td>
            <td data-field="user" hidden></td>
            <td data-field="book"></td>
            <td data-field="loan-date"></td>
            <td data-field="due-date"></td>
            <td data-field="return-date"></td>
            <td data-field="status"></td>
        </tr>
    </template>

    <template id="loans-empty-row-template">
        <tr>
            <td class="empty" data-field="message"></td>
        </tr>
    </template>

    <template id="loans-error-template">
        <div class="banner" id="loans-error-message"></div>
    </template>

    <script src="js/common.js"></script>
    <script src="js/prestamos.js"></script>
</body>
</html>
